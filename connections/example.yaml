# Connection file example.
# connections/ directory is git-ignored except this example file.
# Real connections are created via GUI (Connection dialog) or manually copied here.
#
# The password field uses the crypto__<ENV_VAR>__<token> format:
#   - <ENV_VAR> is an environment variable name holding the Fernet key (set on your machine / CI secrets).
#   - <token> is the Fernet ciphertext.
# To produce an encrypted password:
#   db-pm crypto keygen                        # generate a Fernet key (once) -> put into the env var
#   db-pm crypto encrypt <ENV_VAR>             # hidden prompt in a terminal, or first stdin line in a pipe
# or use the GUI connection dialog (encrypts automatically on save).
#
# =============================================================================
# SCENARIO A: Direct PostgreSQL connection
# =============================================================================
# connection_type: direct
# host: localhost
# port: 5432
# database: mydb
# username: myuser
# password: crypto__ENVOS_CRYPTO_01__gAAAAABm...your-token...
# type: postgres
# options:
#   sslmode: prefer

# =============================================================================
# SCENARIO B: PostgreSQL via SSH tunnel
# =============================================================================
# connection_type: ssh_tunnel
# host: 127.0.0.1           # Local tunnel endpoint (ignored when using tunnel)
# port: 5432
# database: mydb
# username: myuser
# password: crypto__ENVOS_CRYPTO_01__gAAAAABm...your-token...
# type: postgres
# ssh_tunnel:
#   ssh_host: 192.168.1.100  # Jump host IP
#   ssh_port: 22
#   ssh_user: root
#   ssh_pass: crypto__ENVOS_CRYPTO_01__gAAAAABm...your-token...
#   remote_bind_host: 127.0.0.1  # DB host as seen from jump host
#   remote_bind_port: 5432

# =============================================================================
# MCP SERVER POLICY (Phase 19, db-pm-mcp)
# =============================================================================
# Optional block. All settings live here — the MCP server takes no behavioral
# flags. Fail-safe defaults: everything mutating stays off.
#
# mcp:
#   allow_writes: false      # run_script (any INSERT/UPDATE/DELETE/DDL)
#   allow_deploy: false      # deploy_apply / deploy_reset (implies writes)
#   row_limit: 50            # max rows returned by the `query` tool
#   query_timeout_s: 60      # statement_timeout for query/explain (seconds)
#
# Example — a dev database where the LLM agent may run scripts and deploy:
# mcp:
#   allow_writes: true
#   allow_deploy: true
#   row_limit: 200
#   query_timeout_s: 120
